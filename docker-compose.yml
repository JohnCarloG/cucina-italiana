version: "3.9"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cucina
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://user:password@db:3306/cucina
      JWT_SECRET: change-me
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
